name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Do not include children's personal information, credentials or private device identifiers.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android TV device and Android version
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
