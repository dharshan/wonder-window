name: Android build
on:
  push:
    paths: ["app/**", "build.gradle", "settings.gradle", "gradle.properties", "gradle/**", "gradlew", "tools/check_public_apk.py", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["app/**", "build.gradle", "settings.gradle", "gradle.properties", "gradle/**", "gradlew", "tools/check_public_apk.py", ".github/workflows/android-build.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Linux, headless: no macOS, no connected TV, no generated voice clips (the app falls back silently).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # The default 'tools' package no longer exists; AGP downloads platform 34 / build-tools itself once licences are accepted.
          packages: ''
      - name: Build and lint the public edition
        run: ./gradlew --no-daemon assemblePublicDebug lintPublicRelease
      - name: JVM unit tests (anti-repeat history, D8)
        run: ./gradlew --no-daemon testPublicDebugUnitTest
      - name: Public build carries no family values
        run: python3 tools/check_public_apk.py --apk app/build/outputs/apk/public/debug/app-public-debug.apk
      - name: Public build never reads family.properties (fail-closed test)
        run: |
          # Invalid and sentinel values: if the public build read this file, it would fail or leak them.
          printf 'child_name=SENTINEL_NAME\nchild_birth=2000-01\nparent_phone=0000000000\nbuddy_name=SentinelBuddy\napp_title=SentinelTitle\nwarmup_title=SentinelWarm\ndaily_limit_min=not-a-number\naboutme_unlock_all=true\ntry_v3=false\ntry_enabled=false\ntry_allow_supervised=false\nwatch_session_min=47\ntry_families=sentinel_family\ntry_age_band=9-10\n' > family.properties
          ./gradlew --no-daemon assemblePublicDebug
          python3 tools/check_public_apk.py --apk app/build/outputs/apk/public/debug/app-public-debug.apk
          # Negative control: an explicitly requested family build must be flagged by the checker.
          printf 'child_name=SENTINEL_NAME\nbuddy_name=SentinelBuddy\ndaily_limit_min=90\n' > family.properties
          ./gradlew --no-daemon -PwwFamily=true assembleFamilyDebug
          if python3 tools/check_public_apk.py --apk app/build/outputs/apk/family/debug/app-family-debug.apk; then
            echo "check_public_apk.py failed to flag a family build"; exit 1
          fi
          rm -f family.properties
