<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Wonder Window shared pictogram family</title>
<desc>Original consistent vector pictograms for PLAY mechanics and TRY activity families. Every symbol uses the same rounded line, ink outline and limited realm palette; no system emoji.</desc>
<rect width="1920" height="1080" fill="#F8F3E8"/>
<text x="80" y="95" font-family="Fredoka,Arial,sans-serif" font-size="52" font-weight="700" fill="#1F2547">One pictogram family, many discoveries</text>
<text x="82" y="145" font-family="Andika,Arial,sans-serif" font-size="25" fill="#46516B">A consistent silhouette, outline and light direction — the object changes, the visual grammar stays.</text>
<text x="90" y="235" font-family="Fredoka,Arial,sans-serif" font-size="34" font-weight="700" fill="#1F2547">PLAY · ways to think</text>
