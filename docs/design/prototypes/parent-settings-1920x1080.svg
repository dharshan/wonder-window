<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Parent gate and settings</title><desc>Explicit parent gate screen plus grouped settings with visible focus state; proposed gate needs security-owner approval before implementation.</desc><defs><filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1F2547" flood-opacity=".15"/></filter><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8BD0F5"/><stop offset="1" stop-color="#DDF3FA"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#sky)"/><path d="M0 800Q300 700 600 800T1200 790T1920 800V1080H0Z" fill="#A7D79C"/><path d="M0 900Q300 820 600 900T1200 890T1920 900V1080H0Z" fill="#79BD83"/>
<text x="90" y="130" font-family="Fredoka,Andika,Arial,sans-serif" font-size="48" font-weight="700" fill="#1F2547" text-anchor="start">For grown-ups</text>
<g filter="url(#sh)"><rect x="80" y="190" width="700" height="730" rx="30" fill="#fff"/><rect x="105" y="215" width="650" height="680" rx="22" fill="#FBE8B9"/><text x="430" y="310" font-family="Fredoka,Andika,Arial,sans-serif" font-size="38" font-weight="700" fill="#1F2547" text-anchor="middle">Parent check</text><text x="430" y="375" font-family="Andika,Arial,sans-serif" font-size="28" font-weight="700" fill="#3D466A" text-anchor="middle">Hold OK for 3 seconds, then</text><text x="430" y="415" font-family="Andika,Arial,sans-serif" font-size="28" font-weight="700" fill="#3D466A" text-anchor="middle">enter your parent-set PIN with the D-pad.</text><rect x="280" y="480" width="300" height="110" rx="18" fill="#fff" stroke="#1F2547" stroke-width="4"/><text x="430" y="550" font-family="Andika,Arial,sans-serif" font-size="44" font-weight="700" fill="#1F2547" text-anchor="middle">• • • •</text><rect x="260" y="660" width="340" height="78" rx="20" fill="#286B43"/><text x="430" y="710" font-family="Andika,Arial,sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">Continue</text><text x="430" y="825" font-family="Andika,Arial,sans-serif" font-size="28" font-weight="700" fill="#3D466A" text-anchor="middle">BACK returns to child home</text></g>
<g filter="url(#sh)"><rect x="850" y="190" width="970" height="730" rx="30" fill="#fff"/><rect x="875" y="215" width="920" height="680" rx="22" fill="#fff"/><text x="930" y="290" font-family="Andika,Arial,sans-serif" font-size="38" font-weight="700" fill="#1F2547" text-anchor="start">Parent settings</text><rect x="920" y="330" width="830" height="82" rx="16" fill="#E7F3FB" stroke="#1F2547" stroke-width="5"/><text x="955" y="382" font-family="Andika,Arial,sans-serif" font-size="28" font-weight="700" fill="#1F2547" text-anchor="start">Child experience · name and age band</text><rect x="920" y="435" width="830" height="82" rx="16" fill="#F4F6FA" stroke="#D5DCE6" stroke-width="2"/><text x="955" y="487" font-family="Andika,Arial,sans-serif" font-size="28" font-weight="700" fill="#1F2547" text-anchor="start">Time limits · daily and WATCH sessions</text><rect x="920" y="540" width="830" height="82" rx="16" fill="#F4F6FA" stroke="#D5DCE6" stroke-width="2"/><text x="955" y="592" font-family="Andika,Arial,sans-serif" font-size="28" font-weight="700" fill="#1F2547" text-anchor="start">WATCH library · approved channels</text><rect x="920" y="645" width="830" height="82" rx="16" fill="#F4F6FA" stroke="#D5DCE6" stroke-width="2"/><text x="955" y="697" font-family="Andika,Arial,sans-serif" font-size="28" font-weight="700" fill="#1F2547" text-anchor="start">Accessibility · sound and motion</text><rect x="920" y="750" width="830" height="82" rx="16" fill="#F4F6FA" stroke="#D5DCE6" stroke-width="2"/><text x="955" y="802" font-family="Andika,Arial,sans-serif" font-size="28" font-weight="700" fill="#1F2547" text-anchor="start">Privacy &amp; data · local data controls</text></g>
</svg>