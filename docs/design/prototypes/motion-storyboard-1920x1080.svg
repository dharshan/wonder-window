<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Motion storyboard: start and end states</title><desc>Each interaction is shown as a paired start and end state, including focus, press, navigation and Pip response.</desc><rect width="1920" height="1080" fill="#DDF3FA"/><text x="90" y="120" font-family="Fredoka,Andika,Arial" font-size="50" fill="#1F2547">Motion storyboard · start → end</text><g font-family="Andika,Arial" fill="#1F2547"><g><rect x="70" y="190" width="850" height="350" rx="28" fill="#fff"/><text x="110" y="245" font-size="28">Focus · 160 ms ease-out</text><text x="250" y="300" font-size="20">START</text><rect x="130" y="330" width="260" height="120" rx="20" fill="#DDF2C7" stroke="#1F2547" stroke-width="4"/><text x="575" y="300" font-size="20">END</text><rect x="510" y="320" width="280" height="140" rx="24" fill="#DDF2C7" stroke="#1F2547" stroke-width="5"/><rect x="520" y="330" width="260" height="120" rx="18" fill="none" stroke="#FFC94A" stroke-width="10"/></g><g><rect x="1000" y="190" width="850" height="350" rx="28" fill="#fff"/><text x="1040" y="245" font-size="28">Press · 80 ms squash, then settle</text><text x="1180" y="300" font-size="20">START</text><rect x="1060" y="330" width="260" height="120" rx="20" fill="#fff" stroke="#1F2547" stroke-width="5"/><text x="1500" y="300" font-size="20">PRESSED</text><rect x="1420" y="340" width="260" height="100" rx="18" fill="#E6F1F8" stroke="#1F2547" stroke-width="5"/></g><g><rect x="70" y="600" width="850" height="350" rx="28" fill="#fff"/><text x="110" y="655" font-size="28">Navigation · 220 ms fade + 8 px rise</text><text x="250" y="710" font-size="20">START</text><rect x="130" y="740" width="260" height="120" rx="20" fill="#fff" opacity=".5" stroke="#1F2547" stroke-width="4"/><text x="575" y="710" font-size="20">END</text><rect x="510" y="732" width="260" height="120" rx="20" fill="#CDE6F5" stroke="#1F2547" stroke-width="4"/></g><g><rect x="1000" y="600" width="850" height="350" rx="28" fill="#fff"/><text x="1040" y="655" font-size="28">Pip response · turn toward focused card</text><text x="1180" y="910" font-size="24">START · NEUTRAL</text><g transform="translate(1190 700) scale(0.62)"><path d="M44 122L10 104Q4 122 16 132L8 146Q30 154 50 138Z" fill="#7E4B2A"/><path d="M88 166L86 184M78 185H94M114 166L116 184M108 185H124" stroke="#E8892B" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M34 106a66 66 0 1 0 132 0a66 66 0 1 0-132 0Z" fill="#C98A55"/><path d="M39 80A66 66 0 0 1 161 80Q100 60 39 80Z" fill="#7E4B2A"/><path d="M94 44Q86 26 114 18Q104 30 108 42L86 47Q78 28 92 28Z" fill="#7E4B2A"/><ellipse cx="112" cy="98" rx="40" ry="26" fill="#FBE3C4"/><ellipse cx="106" cy="136" rx="44" ry="32" fill="#FFF4E2"/><path d="M112 46Q124 38 130 46Q122 52 112 46Z" fill="#4FA36B"/><circle cx="118" cy="40" r="8" fill="#FFB020"/><path d="M146 92L170 101L146 110Z" fill="#F2A33A"/><circle cx="100" cy="92" r="9" fill="#2B1A12"/><circle cx="128" cy="90" r="9" fill="#2B1A12"/><circle cx="103" cy="89" r="3" fill="#fff"/><circle cx="131" cy="87" r="3" fill="#fff"/><path d="M50 112C35 90 35 58 58 42C82 64 87 93 78 116Z" fill="#A5683B"/><path d="M58 55l10 12M65 70l10 12" stroke="#FFF4E2" stroke-width="5"/><path d="M182 20q20 -28 40 0q-20 28 -40 0" fill="#fff" stroke="#9DB4D3" stroke-width="3"/><text x="202" y="30" font-size="26" fill="#1F2547">?</text></g><text x="1510" y="910" font-size="24">END · TURNED</text><g transform="translate(1660 700) scale(-0.62 0.62)"><path d="M44 122L10 104Q4 122 16 132L8 146Q30 154 50 138Z" fill="#7E4B2A"/><path d="M88 166L86 184M78 185H94M114 166L116 184M108 185H124" stroke="#E8892B" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M34 106a66 66 0 1 0 132 0a66 66 0 1 0-132 0Z" fill="#C98A55"/><path d="M39 80A66 66 0 0 1 161 80Q100 60 39 80Z" fill="#7E4B2A"/><path d="M94 44Q86 26 114 18Q104 30 108 42L86 47Q78 28 92 28Z" fill="#7E4B2A"/><ellipse cx="112" cy="98" rx="40" ry="26" fill="#FBE3C4"/><ellipse cx="106" cy="136" rx="44" ry="32" fill="#FFF4E2"/><path d="M112 46Q124 38 130 46Q122 52 112 46Z" fill="#4FA36B"/><circle cx="118" cy="40" r="8" fill="#FFB020"/><path d="M146 92L170 101L146 110Z" fill="#F2A33A"/><circle cx="100" cy="92" r="9" fill="#2B1A12"/><circle cx="128" cy="90" r="9" fill="#2B1A12"/><circle cx="103" cy="89" r="3" fill="#fff"/><circle cx="131" cy="87" r="3" fill="#fff"/><path d="M50 112C35 90 35 58 58 42C82 64 87 93 78 116Z" fill="#A5683B"/><path d="M58 55l10 12M65 70l10 12" stroke="#FFF4E2" stroke-width="5"/><path d="M182 20q20 -28 40 0q-20 28 -40 0" fill="#fff" stroke="#9DB4D3" stroke-width="3"/><text x="202" y="30" font-size="26" fill="#1F2547">?</text></g></g></g><text x="90" y="1010" font-family="Andika,Arial" font-size="24" fill="#1F2547">Reduced motion: use the END state immediately; no scale, drift, fade or animated character movement.</text></svg>