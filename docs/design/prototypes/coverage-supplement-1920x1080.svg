<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Missing screen-family prototype coverage</title>
<desc>Five explicit design compositions: game instruction, game completion, WATCH player, WATCH pause and TRY family browse. Remote-only controls are labelled.</desc>
<rect width="1920" height="1080" fill="#DDF3FA"/>
<text x="80" y="100" font-family="Fredoka,Andika,Arial" font-size="48" fill="#1F2547">Screen coverage · five missing compositions</text>
<g font-family="Andika,Arial" fill="#1F2547">
<g><rect x="70" y="145" width="560" height="390" rx="26" fill="#fff"/><text x="100" y="195" font-size="30" font-weight="700">Game instruction</text><rect x="100" y="220" width="500" height="175" rx="18" fill="#FBE8B9"/><path d="M210 345l85 -90 85 90z" fill="#4F9B62"/><circle cx="295" cy="285" r="24" fill="#FFC94A"/><text x="410" y="270" font-size="24">Find the next</text><text x="410" y="306" font-size="24">pattern shape.</text><rect x="105" y="430" width="145" height="68" rx="16" fill="#286B43"/><text x="177" y="473" font-size="27" fill="#fff" text-anchor="middle">Start</text><rect x="265" y="430" width="165" height="68" rx="16" fill="#DCECF8"/><text x="347" y="473" font-size="27" text-anchor="middle">Hear again</text><rect x="445" y="430" width="145" height="68" rx="16" fill="#fff" stroke="#1F2547" stroke-width="3"/><text x="517" y="473" font-size="27" text-anchor="middle">Back</text></g>
<g><rect x="680" y="145" width="560" height="390" rx="26" fill="#fff"/><text x="710" y="195" font-size="30" font-weight="700">Game completion</text><rect x="710" y="220" width="500" height="175" rx="18" fill="#DDF2C7"/><path d="M960 255l14 38 41 3 -31 27 10 40 -34 -21 -34 21 10 -40 -31 -27 41 -3z" fill="#FFC94A" stroke="#8E572D" stroke-width="5"/><text x="960" y="390" font-size="24" text-anchor="middle">You found the pattern!</text><rect x="710" y="430" width="145" height="68" rx="16" fill="#DCECF8"/><text x="782" y="473" font-size="27" text-anchor="middle">Play again</text><rect x="870" y="430" width="190" height="68" rx="16" fill="#286B43"/><text x="965" y="473" font-size="21" fill="#fff" text-anchor="middle">Choose another</text><rect x="1075" y="430" width="135" height="68" rx="16" fill="#fff" stroke="#1F2547" stroke-width="3"/><text x="1142" y="473" font-size="27" text-anchor="middle">Home</text></g>
<g><rect x="1290" y="145" width="560" height="390" rx="26" fill="#fff"/><text x="1320" y="195" font-size="30" font-weight="700">WATCH player</text><rect x="1320" y="220" width="500" height="245" rx="18" fill="#0F1638"/><rect x="1360" y="245" width="420" height="195" rx="14" fill="#263568"/><circle cx="1570" cy="340" r="56" fill="#FFC94A"/><path d="M1550 305l55 35 -55 35z" fill="#1F2547"/><text x="1570" y="500" font-size="26" text-anchor="middle">OK · play / pause     BACK · controls</text></g>
<g><rect x="70" y="585" width="850" height="400" rx="26" fill="#fff"/><text x="100" y="635" font-size="30" font-weight="700">WATCH pause sheet</text><rect x="100" y="660" width="790" height="285" rx="18" fill="#0F1638"/><rect x="260" y="680" width="470" height="250" rx="22" fill="#fff"/><text x="495" y="745" font-size="32" text-anchor="middle">Paused</text><rect x="300" y="775" width="180" height="72" rx="16" fill="#286B43"/><text x="390" y="820" font-size="28" fill="#fff" text-anchor="middle">Resume</text><rect x="505" y="775" width="180" height="72" rx="16" fill="#DCECF8"/><text x="595" y="820" font-size="28" text-anchor="middle">Stop</text><text x="495" y="895" font-size="22" text-anchor="middle">BACK closes and restores player focus</text></g>
