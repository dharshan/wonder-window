plugins { id 'com.android.application' }

// Family settings (never committed): copy family.properties.example to family.properties and edit.
def family = new Properties()
def famFile = rootProject.file('family.properties')
if (famFile.exists()) famFile.withReader('UTF-8') { family.load(it) }
def buddy = family.getProperty('buddy_name', 'Pip')
def appTitle = family.getProperty('app_title', 'Wonder Window')
def warmup = family.getProperty('warmup_title', buddy + "'s Warm-up")
def childName = family.getProperty('child_name', '')
def childBirth = family.getProperty('child_birth', '')
def aboutAll = family.getProperty('aboutme_unlock_all', 'false')
// One daily screen-time limit shared by Watch, Play and Try (parent sets it; 30-180 min, default 120).
// TRY v3 parent switches (family.properties)
def tryV3 = family.getProperty('try_v3', 'true')
def tryFamilies = family.getProperty('try_families', '')
def tryAge = family.getProperty('try_age_band', '5-6')
def trySup = family.getProperty('try_allow_supervised', 'true')
def tryOn = family.getProperty('try_enabled', 'true')
// v1.1-review flags (public default OFF): warm-up decides session minutes; phone/address rounds in All About Me
def warmupMinutes = family.getProperty('watch_warmup_minutes', 'false')
def sessionMin = Math.max(5, Math.min(60, (family.getProperty('watch_session_min', '20') as int)))
def aboutSafety = family.getProperty('aboutme_phone_address', 'false')
def dailyLimit = Math.max(30, Math.min(180, (family.getProperty('daily_limit_min', '120') as int)))
// Phone practice: only a slow salted hash (PBKDF2, 200k rounds, fresh salt each build) of the whole number reaches the TV.
def phone = family.getProperty('parent_phone', '').replaceAll('[^0-9]', '')
def salt = java.util.UUID.randomUUID().toString()
def phoneHash = ''
if (phone.length() == 10) {
    def spec = new javax.crypto.spec.PBEKeySpec(phone.toCharArray(), salt.getBytes('UTF-8'), 200000, 256)
    phoneHash = javax.crypto.SecretKeyFactory.getInstance('PBKDF2WithHmacSHA256').generateSecret(spec).getEncoded().encodeHex().toString()
}

android {
    namespace 'org.wonderwindow.tv'
    compileSdk 34
    defaultConfig {
        applicationId 'org.wonderwindow.tv'; minSdk 26; targetSdk 34; versionCode 22; versionName '0.9.0-try3'
        resValue 'string', 'app_name', appTitle.replace("'", "\\'")
        resValue 'string', 'buddy_name', buddy.replace("'", "\\'")
        resValue 'string', 'warmup_title', warmup.replace("'", "\\'")
        resValue 'string', 'child_name', childName.replace("'", "\\'")
        resValue 'string', 'child_birth', childBirth
        resValue 'bool', 'aboutme_unlock_all', aboutAll
        resValue 'integer', 'daily_limit_min', dailyLimit.toString()
        resValue 'bool', 'try_v3', tryV3
        resValue 'bool', 'watch_warmup_minutes', warmupMinutes
        resValue 'integer', 'watch_session_min', sessionMin.toString()
        resValue 'bool', 'aboutme_phone_address', aboutSafety
        resValue 'bool', 'try_enabled', tryOn
        resValue 'bool', 'try_allow_supervised', trySup
        resValue 'string', 'try_families', tryFamilies
        resValue 'string', 'try_age_band', tryAge
        resValue 'string', 'phone_hash', phoneHash
        resValue 'string', 'phone_salt', salt
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { error 'NewApi'; abortOnError true; checkReleaseBuilds false }
}
